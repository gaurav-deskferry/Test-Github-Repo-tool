<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orchestra — Multi-Agent Automation Platform</title>
  <meta name="description" content="Orchestra lets teams design, run and supervise fleets of AI agents that plan, call tools and finish real work end to end." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#070A14',
            panel: '#0E1424',
            brand: {
              50: '#eef4ff', 100: '#d9e5ff', 200: '#bcd1ff', 300: '#8eb2ff',
              400: '#5a89ff', 500: '#3563f6', 600: '#2347db', 700: '#1c38ae',
              800: '#1a318a', 900: '#1a2d6d'
            },
            accent: '#36E0C0'
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          keyframes: {
            floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
          },
          animation: {
            floaty: 'floaty 6s ease-in-out infinite'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    [v-cloak] { display: none; }
    .grid-bg {
      background-image:
        radial-gradient(60rem 40rem at 70% -10%, rgba(53,99,246,.25), transparent 60%),
        radial-gradient(40rem 30rem at 10% 10%, rgba(54,224,192,.14), transparent 60%),
        linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: auto, auto, 56px 56px, 56px 56px;
    }
  </style>
</head>

<body class="bg-ink text-slate-200 font-sans antialiased">
  <div id="app" v-cloak>
    <site-nav :links="nav.links" :brand="brand"></site-nav>

    <main>
      <hero-section
        :eyebrow="hero.eyebrow"
        :title="hero.title"
        :highlight="hero.highlight"
        :subtitle="hero.subtitle"
        :primary-cta="hero.primaryCta"
        :secondary-cta="hero.secondaryCta"
        :stats="hero.stats"
        :agents="agents">
      </hero-section>

      <section-shell id="features" :eyebrow="features.eyebrow" :title="features.title" :subtitle="features.subtitle">
        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
          <feature-card
            v-for="feature in features.items"
            :key="feature.title"
            :icon="feature.icon"
            :title="feature.title"
            :body="feature.body">
          </feature-card>
        </div>
      </section-shell>

      <section-shell id="agents" :eyebrow="roster.eyebrow" :title="roster.title" :subtitle="roster.subtitle">
        <div class="mb-8 flex flex-wrap justify-center gap-2">
          <button
            v-for="team in teams"
            :key="team"
            @click="activeTeam = team"
            :class="[
              'rounded-full px-4 py-2 text-sm font-medium transition',
              activeTeam === team
                ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/30'
                : 'bg-white/5 text-slate-300 hover:bg-white/10'
            ]">
            {{ team }}
          </button>
        </div>
        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
          <agent-card
            v-for="agent in visibleAgents"
            :key="agent.name"
            :agent="agent">
          </agent-card>
        </div>
      </section-shell>

      <section-shell id="how-it-works" :eyebrow="pipeline.eyebrow" :title="pipeline.title" :subtitle="pipeline.subtitle">
        <ol class="grid gap-6 md:grid-cols-2 lg:grid-cols-4">
          <step-card
            v-for="(step, index) in pipeline.steps"
            :key="step.title"
            :index="index + 1"
            :title="step.title"
            :body="step.body"
            :last="index === pipeline.steps.length - 1">
          </step-card>
        </ol>
      </section-shell>

      <section-shell id="pricing" :eyebrow="pricing.eyebrow" :title="pricing.title" :subtitle="pricing.subtitle">
        <div class="mb-10 flex items-center justify-center gap-3 text-sm">
          <span :class="billing === 'monthly' ? 'text-white' : 'text-slate-400'">Monthly</span>
          <button
            type="button"
            role="switch"
            :aria-checked="billing === 'yearly'"
            aria-label="Toggle yearly billing"
            @click="billing = billing === 'monthly' ? 'yearly' : 'monthly'"
            :class="[
              'relative h-7 w-14 rounded-full transition',
              billing === 'yearly' ? 'bg-accent/80' : 'bg-white/15'
            ]">
            <span
              class="absolute top-1 h-5 w-5 rounded-full bg-white transition-all"
              :class="billing === 'yearly' ? 'left-8' : 'left-1'"></span>
          </button>
          <span :class="billing === 'yearly' ? 'text-white' : 'text-slate-400'">
            Yearly <span class="text-accent">−20%</span>
          </span>
        </div>
        <div class="grid gap-6 lg:grid-cols-3">
          <pricing-card
            v-for="plan in pricing.plans"
            :key="plan.name"
            :plan="plan"
            :billing="billing">
          </pricing-card>
        </div>
      </section-shell>

      <section-shell id="customers" :eyebrow="social.eyebrow" :title="social.title" :subtitle="social.subtitle">
        <div class="grid gap-6 md:grid-cols-3">
          <testimonial-card
            v-for="quote in social.quotes"
            :key="quote.author"
            :quote="quote">
          </testimonial-card>
        </div>
      </section-shell>

      <cta-banner
        :title="cta.title"
        :subtitle="cta.subtitle"
        :primary-cta="cta.primaryCta"
        :secondary-cta="cta.secondaryCta">
      </cta-banner>
    </main>

    <site-footer :brand="brand" :columns="footer.columns" :note="footer.note"></site-footer>
  </div>

  <script>
    const { createApp, computed, ref } = Vue;

    const app = createApp({
      setup() {
        const activeTeam = ref('All agents');
        const billing = ref('monthly');

        const agents = [
          { name: 'Scout', team: 'Research', role: 'Research agent', blurb: 'Crawls docs, tickets and the open web, then hands back sourced briefs.', tools: ['Web', 'Notion', 'Vector DB'], status: 'running' },
          { name: 'Forge', team: 'Engineering', role: 'Code agent', blurb: 'Opens branches, writes the patch and keeps the test suite green.', tools: ['GitHub', 'CI', 'Shell'], status: 'running' },
          { name: 'Ledger', team: 'Operations', role: 'Finance ops agent', blurb: 'Reconciles invoices across ERP and billing, flags only the exceptions.', tools: ['NetSuite', 'Stripe'], status: 'idle' },
          { name: 'Relay', team: 'Operations', role: 'Support agent', blurb: 'Triages inbound tickets, drafts replies and escalates with full context.', tools: ['Zendesk', 'Slack'], status: 'running' },
          { name: 'Atlas', team: 'Research', role: 'Analyst agent', blurb: 'Turns raw warehouse tables into decision-ready weekly narratives.', tools: ['Snowflake', 'Python'], status: 'idle' },
          { name: 'Warden', team: 'Engineering', role: 'Supervisor agent', blurb: 'Reviews every agent action against your policies before it ships.', tools: ['Policy', 'Audit log'], status: 'running' }
        ];

        const teams = ['All agents', 'Research', 'Engineering', 'Operations'];

        const visibleAgents = computed(() =>
          activeTeam.value === 'All agents'
            ? agents
            : agents.filter(agent => agent.team === activeTeam.value)
        );

        return {
          activeTeam,
          billing,
          agents,
          teams,
          visibleAgents,

          brand: { name: 'Orchestra', tagline: 'Multi-agent automation for teams that ship.' },

          nav: {
            links: [
              { label: 'Platform', href: '#features' },
              { label: 'Agents', href: '#agents' },
              { label: 'How it works', href: '#how-it-works' },
              { label: 'Pricing', href: '#pricing' },
              { label: 'Customers', href: '#customers' }
            ]
          },

          hero: {
            eyebrow: 'Multi-agent automation platform',
            title: 'Put a team of agents on the work',
            highlight: 'nobody wants to do',
            subtitle: 'Orchestra plans the work, splits it across specialised agents, lets them call your real tools, and keeps a supervisor in the loop so every action is reviewable.',
            primaryCta: { label: 'Start building free', href: '#pricing' },
            secondaryCta: { label: 'Watch a 2-min run', href: '#how-it-works' },
            stats: [
              { value: '42k', label: 'Agent runs / day' },
              { value: '98.4%', label: 'Tasks completed unattended' },
              { value: '11 min', label: 'Median hand-off to done' }
            ]
          },

          features: {
            eyebrow: 'Platform',
            title: 'Everything a fleet of agents needs to be trusted',
            subtitle: 'Orchestration, tools, memory and guardrails in one runtime — not six glued-together scripts.',
            items: [
              { icon: 'graph', title: 'Visual orchestration', body: 'Compose planners, workers and reviewers into a graph. Branch, retry and fan out without writing glue code.' },
              { icon: 'tools', title: '200+ tool connectors', body: 'GitHub, Slack, Snowflake, Stripe, your internal APIs. Scoped credentials per agent, revocable in one click.' },
              { icon: 'memory', title: 'Shared team memory', body: 'Agents read and write to one versioned knowledge store, so the second run is smarter than the first.' },
              { icon: 'shield', title: 'Policy guardrails', body: 'Declare what an agent may spend, touch and send. Warden blocks anything outside the envelope before it runs.' },
              { icon: 'eye', title: 'Full-run observability', body: 'Replay any run step by step: prompts, tool calls, costs and diffs, with alerts when a path drifts.' },
              { icon: 'human', title: 'Human-in-the-loop', body: 'Route approvals to Slack or email. Humans unblock the 2% that needs judgement, agents handle the rest.' }
            ]
          },

          roster: {
            eyebrow: 'The roster',
            title: 'Specialised agents, one shared workspace',
            subtitle: 'Hire the agents you need, give them tools and a brief — they coordinate the hand-offs themselves.'
          },

          pipeline: {
            eyebrow: 'How it works',
            title: 'From one brief to finished work',
            subtitle: 'Every run follows the same auditable loop, whether it takes four seconds or four hours.',
            steps: [
              { title: 'Describe the outcome', body: 'Write the goal in plain language, or trigger it from a webhook, schedule or ticket.' },
              { title: 'Planner splits the work', body: 'The planning agent decomposes the goal into tasks and assigns each to the best-suited agent.' },
              { title: 'Agents execute in parallel', body: 'Workers call tools, share findings through team memory and resolve each other’s blockers.' },
              { title: 'Supervisor ships it', body: 'Warden checks the result against policy, requests approval if needed, then delivers the output.' }
            ]
          },

          pricing: {
            eyebrow: 'Pricing',
            title: 'Start free, scale by the run',
            subtitle: 'No per-seat tax on your agents. Pay for the work they actually complete.',
            plans: [
              {
                name: 'Builder', monthly: 0, yearly: 0, blurb: 'For solo builders wiring up their first agent.',
                cta: 'Start free', featured: false,
                perks: ['2 concurrent agents', '500 runs / month', 'Core tool connectors', 'Community support']
              },
              {
                name: 'Team', monthly: 79, yearly: 63, blurb: 'For teams running agents in production every day.',
                cta: 'Start 14-day trial', featured: true,
                perks: ['20 concurrent agents', '25k runs / month', 'All 200+ connectors', 'Policy guardrails & approvals', 'Run replay and alerting']
              },
              {
                name: 'Enterprise', monthly: null, yearly: null, blurb: 'For regulated fleets that need their own boundary.',
                cta: 'Talk to sales', featured: false,
                perks: ['Unlimited agents', 'VPC or on-prem runtime', 'SSO, SCIM, audit export', 'Custom policy engine', 'Named solutions architect']
              }
            ]
          },

          social: {
            eyebrow: 'Customers',
            title: 'Teams that handed the busywork over',
            subtitle: 'Operations, support and engineering groups running Orchestra in production today.',
            quotes: [
              { body: 'Our reconciliation close went from nine analyst-days to a single afternoon of exception review.', author: 'Priya Raman', role: 'VP Finance Ops, Northwind', initials: 'PR' },
              { body: 'The supervisor agent is the reason legal signed off. Every tool call is logged, scoped and replayable.', author: 'Marcus Webb', role: 'Head of Platform, Arcadia', initials: 'MW' },
              { body: 'We shipped 140 dependency upgrades in a week. Forge opened the PRs, we just reviewed them.', author: 'Lena Okafor', role: 'Staff Engineer, Tidepool', initials: 'LO' }
            ]
          },

          cta: {
            title: 'Give your agents something to do tonight',
            subtitle: 'Spin up a fleet in minutes. Free while you build, no credit card.',
            primaryCta: { label: 'Create free workspace', href: '#pricing' },
            secondaryCta: { label: 'Book a walkthrough', href: '#customers' }
          },

          footer: {
            note: '© 2025 Orchestra Labs. All rights reserved.',
            columns: [
              { title: 'Product', links: [{ label: 'Platform', href: '#features' }, { label: 'Agents', href: '#agents' }, { label: 'Pricing', href: '#pricing' }] },
              { title: 'Resources', links: [{ label: 'How it works', href: '#how-it-works' }, { label: 'Customers', href: '#customers' }, { label: 'Changelog', href: '#' }] },
              { title: 'Company', links: [{ label: 'About', href: '#' }, { label: 'Careers', href: '#' }, { label: 'Contact', href: '#' }] }
            ]
          }
        };
      }
    });

    /* ---------- Reusable presentational components ---------- */

    app.component('app-icon', {
      props: { name: { type: String, required: true }, size: { type: String, default: 'h-6 w-6' } },
      computed: {
        path() {
          return {
            graph: 'M4 18V6m0 12h16M9 14l3-4 3 3 4-6',
            tools: 'M14.7 6.3a4 4 0 0 1-5.4 5.4L5 16v3h3l4.3-4.3a4 4 0 0 1 5.4-5.4l-2.6 2.6-1.8-1.8 2.4-2.8Z',
            memory: 'M12 3a4 4 0 0 0-4 4v1a3 3 0 0 0 0 6v1a4 4 0 0 0 8 0v-1a3 3 0 0 0 0-6V7a4 4 0 0 0-4-4Zm0 0v18',
            shield: 'M12 3 5 6v5c0 4.4 2.9 8.3 7 10 4.1-1.7 7-5.6 7-10V6l-7-3Zm-2.5 8.5 2 2 3.5-4',
            eye: 'M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Zm9.5 2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z',
            human: 'M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm-7 9a7 7 0 0 1 14 0',
            arrow: 'M5 12h14m-5-6 6 6-6 6',
            check: 'm5 13 4 4 10-10',
            menu: 'M4 7h16M4 12h16M4 17h16',
            close: 'm6 6 12 12M18 6 6 18'
          }[this.name] || '';
        }
      },
      template: `
        <svg :class="size" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path :d="path" />
        </svg>`
    });

    app.component('app-button', {
      props: {
        href: { type: String, default: '#' },
        variant: { type: String, default: 'primary' },
        withIcon: { type: Boolean, default: false }
      },
      computed: {
        classes() {
          const base = 'inline-flex items-center justify-center gap-2 rounded-xl px-5 py-3 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-400 focus-visible:ring-offset-2 focus-visible:ring-offset-ink';
          return `${base} ${{
            primary: 'bg-brand-500 text-white shadow-lg shadow-brand-500/30 hover:bg-brand-400',
            ghost: 'bg-white/5 text-slate-100 ring-1 ring-inset ring-white/15 hover:bg-white/10',
            accent: 'bg-accent text-ink hover:bg-accent/85'
          }[this.variant]}`;
        }
      },
      template: `
        <a :href="href" :class="classes">
          <slot></slot>
          <app-icon v-if="withIcon" name="arrow" size="h-4 w-4" />
        </a>`
    });

    app.component('section-shell', {
      props: { eyebrow: String, title: String, subtitle: String },
      template: `
        <section class="mx-auto max-w-7xl px-6 py-20 sm:py-24">
          <header class="mx-auto mb-12 max-w-2xl text-center">
            <p class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] text-accent">{{ eyebrow }}</p>
            <h2 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">{{ title }}</h2>
            <p v-if="subtitle" class="mt-4 text-base leading-relaxed text-slate-400">{{ subtitle }}</p>
          </header>
          <slot></slot>
        </section>`
    });

    app.component('surface-card', {
      props: { featured: { type: Boolean, default: false } },
      template: `
        <div :class="[
          'rounded-2xl p-6 backdrop-blur transition duration-200',
          featured
            ? 'bg-gradient-to-b from-brand-500/20 to-panel ring-1 ring-brand-400/50 shadow-2xl shadow-brand-900/40'
            : 'bg-white/[0.04] ring-1 ring-white/10 hover:-translate-y-1 hover:bg-white/[0.07] hover:ring-white/20'
        ]">
          <slot></slot>
        </div>`
    });

    /* ---------- Page sections ---------- */

    app.component('site-nav', {
      props: { links: { type: Array, required: true }, brand: { type: Object, required: true } },
      data: () => ({ open: false }),
      template: `
        <header class="sticky top-0 z-50 border-b border-white/10 bg-ink/80 backdrop-blur-xl">
          <nav class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-6 py-4" aria-label="Main">
            <a href="#" class="flex items-center gap-2.5">
              <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-brand-400 to-accent text-ink">
                <app-icon name="graph" size="h-5 w-5" />
              </span>
              <span class="text-lg font-bold tracking-tight text-white">{{ brand.name }}</span>
            </a>

            <ul class="hidden items-center gap-1 lg:flex">
              <li v-for="link in links" :key="link.href">
                <a :href="link.href"
                   class="rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white">
                  {{ link.label }}
                </a>
              </li>
            </ul>

            <div class="hidden items-center gap-3 lg:flex">
              <a href="#" class="text-sm font-medium text-slate-300 transition hover:text-white">Sign in</a>
              <app-button href="#pricing" with-icon>Get started</app-button>
            </div>

            <button type="button" class="rounded-lg p-2 text-slate-200 ring-1 ring-white/15 lg:hidden"
                    :aria-expanded="open" aria-label="Toggle navigation" @click="open = !open">
              <app-icon :name="open ? 'close' : 'menu'" />
            </button>
          </nav>

          <div v-show="open" class="border-t border-white/10 px-6 pb-6 pt-2 lg:hidden">
            <ul class="space-y-1">
              <li v-for="link in links" :key="link.href">
                <a :href="link.href" @click="open = false"
                   class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-white/5 hover:text-white">
                  {{ link.label }}
                </a>
              </li>
            </ul>
            <app-button href="#pricing" class="mt-4 w-full" with-icon>Get started</app-button>
          </div>
        </header>`
    });

    app.component('agent-chip', {
      props: { agent: { type: Object, required: true } },
      template: `
        <div class="flex items-center gap-3 rounded-xl bg-white/5 px-3 py-2.5 ring-1 ring-white/10">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-brand-500/20 text-xs font-bold text-brand-200">
            {{ agent.name.slice(0, 2).toUpperCase() }}
          </span>
          <div class="min-w-0">
            <p class="truncate text-sm font-semibold text-white">{{ agent.name }}</p>
            <p class="truncate text-xs text-slate-400">{{ agent.role }}</p>
          </div>
          <status-dot :status="agent.status" class="ml-auto" />
        </div>`
    });

    app.component('status-dot', {
      props: { status: { type: String, required: true } },
      template: `
        <span class="flex items-center gap-1.5 text-[11px] font-medium"
              :class="status === 'running' ? 'text-accent' : 'text-slate-500'">
          <span class="h-1.5 w-1.5 rounded-full"
                :class="status === 'running' ? 'bg-accent animate-pulse' : 'bg-slate-600'"></span>
          {{ status }}
        </span>`
    });

    app.component('hero-section', {
      props: {
        eyebrow: String, title: String, highlight: String, subtitle: String,
        primaryCta: Object, secondaryCta: Object,
        stats: { type: Array, default: () => [] },
        agents: { type: Array, default: () => [] }
      },
      template: `
        <section class="grid-bg relative overflow-hidden border-b border-white/10">
          <div class="mx-auto grid max-w-7xl items-center gap-14 px-6 py-20 sm:py-28 lg:grid-cols-2">
            <div>
              <span class="inline-flex items-center gap-2 rounded-full bg-white/5 px-3 py-1 text-xs font-medium text-accent ring-1 ring-inset ring-accent/30">
                <span class="h-1.5 w-1.5 rounded-full bg-accent"></span>{{ eyebrow }}
              </span>
              <h1 class="mt-6 text-4xl font-extrabold leading-[1.1] tracking-tight text-white sm:text-6xl">
                {{ title }}
                <span class="bg-gradient-to-r from-brand-300 to-accent bg-clip-text text-transparent">{{ highlight }}</span>
              </h1>
              <p class="mt-6 max-w-xl text-lg leading-relaxed text-slate-400">{{ subtitle }}</p>

              <div class="mt-8 flex flex-wrap gap-3">
                <app-button :href="primaryCta.href" with-icon>{{ primaryCta.label }}</app-button>
                <app-button :href="secondaryCta.href" variant="ghost">{{ secondaryCta.label }}</app-button>
              </div>

              <dl class="mt-12 grid max-w-lg grid-cols-3 gap-6 border-t border-white/10 pt-8">
                <div v-for="stat in stats" :key="stat.label">
                  <dt class="text-2xl font-bold text-white sm:text-3xl">{{ stat.value }}</dt>
                  <dd class="mt-1 text-xs leading-snug text-slate-400">{{ stat.label }}</dd>
                </div>
              </dl>
            </div>

            <div class="animate-floaty rounded-2xl bg-panel/80 p-5 ring-1 ring-white/10 shadow-2xl shadow-brand-900/40 backdrop-blur">
              <div class="mb-4 flex items-center justify-between">
                <p class="text-sm font-semibold text-white">Run #4821 · quarterly close</p>
                <status-dot status="running" />
              </div>
              <div class="space-y-2.5">
                <agent-chip v-for="agent in agents.slice(0, 4)" :key="agent.name" :agent="agent" />
              </div>
              <div class="mt-5 rounded-xl bg-ink/70 p-4 font-mono text-[11px] leading-relaxed text-slate-400 ring-1 ring-white/10">
                <p><span class="text-accent">planner</span> → split goal into 7 tasks</p>
                <p><span class="text-brand-300">scout</span> → fetched 24 source documents</p>
                <p><span class="text-brand-300">ledger</span> → reconciled 1,204 invoices</p>
                <p><span class="text-accent">warden</span> → policy check passed, awaiting sign-off</p>
              </div>
            </div>
          </div>
        </section>`
    });

    app.component('feature-card', {
      props: { icon: String, title: String, body: String },
      template: `
        <surface-card>
          <span class="mb-4 grid h-11 w-11 place-items-center rounded-xl bg-brand-500/15 text-brand-300 ring-1 ring-inset ring-brand-400/25">
            <app-icon :name="icon" />
          </span>
          <h3 class="text-base font-semibold text-white">{{ title }}</h3>
          <p class="mt-2 text-sm leading-relaxed text-slate-400">{{ body }}</p>
        </surface-card>`
    });

    app.component('agent-card', {
      props: { agent: { type: Object, required: true } },
      template: `
        <surface-card>
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <span class="grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br from-brand-500/40 to-accent/30 text-sm font-bold text-white">
                {{ agent.name.slice(0, 2).toUpperCase() }}
              </span>
              <div>
                <h3 class="text-base font-semibold text-white">{{ agent.name }}</h3>
                <p class="text-xs text-slate-400">{{ agent.role }}</p>
              </div>
            </div>
            <status-dot :status="agent.status" />
          </div>
          <p class="mt-4 text-sm leading-relaxed text-slate-400">{{ agent.blurb }}</p>
          <ul class="mt-4 flex flex-wrap gap-2">
            <li v-for="tool in agent.tools" :key="tool"
                class="rounded-md bg-white/5 px-2 py-1 text-[11px] font-medium text-slate-300 ring-1 ring-inset ring-white/10">
              {{ tool }}
            </li>
          </ul>
        </surface-card>`
    });

    app.component('step-card', {
      props: { index: Number, title: String, body: String, last: Boolean },
      template: `
        <li class="relative">
          <surface-card>
            <span class="grid h-10 w-10 place-items-center rounded-full bg-brand-500 text-sm font-bold text-white">
              {{ index }}
            </span>
            <h3 class="mt-4 text-base font-semibold text-white">{{ title }}</h3>
            <p class="mt-2 text-sm leading-relaxed text-slate-400">{{ body }}</p>
          </surface-card>
          <span v-if="!last" class="absolute -right-3 top-1/2 hidden -translate-y-1/2 text-brand-400/60 lg:block">
            <app-icon name="arrow" size="h-5 w-5" />
          </span>
        </li>`
    });

    app.component('pricing-card', {
      props: { plan: { type: Object, required: true }, billing: { type: String, required: true } },
      computed: {
        price() {
          const amount = this.billing === 'yearly' ? this.plan.yearly : this.plan.monthly;
          return amount === null ? 'Custom' : '$' + amount;
        },
        suffix() {
          return this.plan.monthly === null ? '' : '/ month';
        }
      },
      template: `
        <surface-card :featured="plan.featured">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-semibold text-white">{{ plan.name }}</h3>
            <span v-if="plan.featured" class="rounded-full bg-accent/15 px-2.5 py-1 text-[11px] font-semibold text-accent">
              Most popular
            </span>
          </div>
          <p class="mt-2 text-sm text-slate-400">{{ plan.blurb }}</p>
          <p class="mt-6 flex items-baseline gap-1.5">
            <span class="text-4xl font-extrabold tracking-tight text-white">{{ price }}</span>
            <span class="text-sm text-slate-400">{{ suffix }}</span>
          </p>
          <app-button :variant="plan.featured ? 'accent' : 'ghost'" class="mt-6 w-full">
            {{ plan.cta }}
          </app-button>
          <ul class="mt-6 space-y-3 border-t border-white/10 pt-6">
            <li v-for="perk in plan.perks" :key="perk" class="flex items-start gap-2.5 text-sm text-slate-300">
              <app-icon name="check" size="h-4 w-4 mt-0.5 shrink-0 text-accent" />
              <span>{{ perk }}</span>
            </li>
          </ul>
        </surface-card>`
    });

    app.component('testimonial-card', {
      props: { quote: { type: Object, required: true } },
      template: `
        <surface-card>
          <figure class="flex h-full flex-col">
            <blockquote class="text-sm leading-relaxed text-slate-300">“{{ quote.body }}”</blockquote>
            <figcaption class="mt-6 flex items-center gap-3 border-t border-white/10 pt-5">
              <span class="grid h-10 w-10 place-items-center rounded-full bg-brand-500/25 text-xs font-bold text-brand-200">
                {{ quote.initials }}
              </span>
              <span>
                <span class="block text-sm font-semibold text-white">{{ quote.author }}</span>
                <span class="block text-xs text-slate-400">{{ quote.role }}</span>
              </span>
            </figcaption>
          </figure>
        </surface-card>`
    });

    app.component('cta-banner', {
      props: { title: String, subtitle: String, primaryCta: Object, secondaryCta: Object },
      template: `
        <section class="mx-auto max-w-7xl px-6 pb-24">
          <div class="grid-bg overflow-hidden rounded-3xl px-8 py-14 text-center ring-1 ring-white/10 sm:px-16">
            <h2 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">{{ title }}</h2>
            <p class="mx-auto mt-4 max-w-xl text-base text-slate-400">{{ subtitle }}</p>
            <div class="mt-8 flex flex-wrap justify-center gap-3">
              <app-button :href="primaryCta.href" with-icon>{{ primaryCta.label }}</app-button>
              <app-button :href="secondaryCta.href" variant="ghost">{{ secondaryCta.label }}</app-button>
            </div>
          </div>
        </section>`
    });

    app.component('site-footer', {
      props: { brand: Object, columns: Array, note: String },
      template: `
        <footer class="border-t border-white/10 bg-panel/40">
          <div class="mx-auto grid max-w-7xl gap-10 px-6 py-14 md:grid-cols-[2fr_repeat(3,1fr)]">
            <div>
              <div class="flex items-center gap-2.5">
                <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-brand-400 to-accent text-ink">
                  <app-icon name="graph" size="h-5 w-5" />
                </span>
                <span class="text-lg font-bold text-white">{{ brand.name }}</span>
              </div>
              <p class="mt-4 max-w-xs text-sm leading-relaxed text-slate-400">{{ brand.tagline }}</p>
            </div>
            <div v-for="column in columns" :key="column.title">
              <h3 class="text-sm font-semibold text-white">{{ column.title }}</h3>
              <ul class="mt-4 space-y-2.5">
                <li v-for="link in column.links" :key="link.label">
                  <a :href="link.href" class="text-sm text-slate-400 transition hover:text-white">{{ link.label }}</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="border-t border-white/10 px-6 py-6">
            <p class="mx-auto max-w-7xl text-xs text-slate-500">{{ note }}</p>
          </div>
        </footer>`
    });

    app.mount('#app');
  </script>
</body>
</html>
