<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swarmline — Multi-Agent Automation Platform</title>
  <meta name="description" content="Swarmline orchestrates fleets of AI agents that plan, execute and verify your back-office work end to end." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#070A14',
            surface: '#0E1324',
            brand: {
              50: '#eef4ff', 100: '#dbe6ff', 200: '#bed2ff', 300: '#92b4ff',
              400: '#5e8bff', 500: '#3b66f6', 600: '#2847db', 700: '#2039b1',
              800: '#1f338c', 900: '#1f306e'
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
          },
          animation: { float: 'float 6s ease-in-out infinite' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <style>
    body { background-color: #070A14; }
    .glow { background: radial-gradient(60% 60% at 50% 0%, rgba(59,102,246,.35) 0%, rgba(7,10,20,0) 70%); }
    .card-ring { box-shadow: inset 0 1px 0 0 rgba(255,255,255,.06); }
    [v-cloak] { display: none; }
  </style>
</head>
<body class="font-sans text-slate-300 antialiased">

<div id="app" v-cloak>
  <site-nav :links="nav" brand="Swarmline"></site-nav>

  <main>
    <hero-section
      eyebrow="Multi-agent automation"
      title="A workforce of agents that finishes the job."
      subtitle="Swarmline plans the work, splits it across specialised agents, runs the tools and verifies every result — so your operations keep moving while you sleep."
      :stats="heroStats">
    </hero-section>

    <logo-strip :logos="logos"></logo-strip>

    <section-block
      id="features"
      eyebrow="Platform"
      heading="Everything an agent fleet needs to be trusted"
      sub="Orchestration, memory, tools and guardrails in one runtime — not five glued-together scripts.">
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <feature-card
          v-for="feature in features"
          :key="feature.title"
          :icon="feature.icon"
          :title="feature.title"
          :body="feature.body">
        </feature-card>
      </div>
    </section-block>

    <section-block
      id="agents"
      eyebrow="The swarm"
      heading="Specialised agents, one shared plan"
      sub="Each agent owns a narrow job and reports back to the orchestrator. Pick a role to see what it handles.">
      <agent-explorer :agents="agents"></agent-explorer>
    </section-block>

    <section-block
      id="how"
      eyebrow="How it works"
      heading="From request to verified outcome"
      sub="Four stages, fully observable. Every step emits a trace you can replay.">
      <ol class="grid gap-6 md:grid-cols-2 lg:grid-cols-4">
        <step-card
          v-for="(step, i) in steps"
          :key="step.title"
          :index="i + 1"
          :title="step.title"
          :body="step.body">
        </step-card>
      </ol>
    </section-block>

    <section-block
      id="pricing"
      eyebrow="Pricing"
      heading="Start small, scale the swarm"
      sub="Every plan includes traces, replays and human approval gates.">
      <div class="grid gap-6 lg:grid-cols-3">
        <pricing-card
          v-for="plan in plans"
          :key="plan.name"
          :name="plan.name"
          :price="plan.price"
          :cadence="plan.cadence"
          :description="plan.description"
          :perks="plan.perks"
          :featured="plan.featured"
          :cta="plan.cta"
          @select="selectPlan">
        </pricing-card>
      </div>
      <p v-if="selectedPlan" class="mt-8 text-center text-sm text-brand-300">
        Nice pick — the <span class="font-semibold">{{ selectedPlan }}</span> plan is ready when you are.
      </p>
    </section-block>

    <cta-banner
      title="Put your busywork on autopilot"
      body="Spin up your first swarm in under ten minutes. No credit card, no migration."
      action="Start free">
    </cta-banner>
  </main>

  <site-footer brand="Swarmline" :columns="footerColumns"></site-footer>
</div>

<script type="text/x-template" id="tpl-agent-explorer">

    }
  });

  app.component('hero-section', {
    template: '#tpl-hero-section',
    props: {
      eyebrow: String,
      title: String,
      subtitle: String,
      stats: { type: Array, default: () => [] }
    }
  });

  app.component('logo-strip', {
    template: '#tpl-logo-strip',
    props: { logos: { type: Array, default: () => [] } }
  });

  app.component('section-block', {
    template: '#tpl-section-block',
    props: {
      id: String,
      eyebrow: String,
      heading: String,
      sub: String
    }
  });

  app.component('feature-card', {
    template: '#tpl-feature-card',
    props: { icon: String, title: String, body: String }
  });

  app.component('agent-explorer', {
    template: '#tpl-agent-explorer',
    props: { agents: { type: Array, required: true } },
    data() {
      return { active: this.agents[0] };
    }
  });

  app.component('step-card', {
    template: '#tpl-step-card',
    props: { index: Number, title: String, body: String }
  });

  app.component('pricing-card', {
    template: '#tpl-pricing-card',
    props: {
      name: String,
      price: String,
      cadence: { type: String, default: '' },
      description: String,
      perks: { type: Array, default: () => [] },
      featured: { type: Boolean, default: false },
      cta: { type: String, default: 'Get started' }
    },
    emits: ['select']
  });

  app.component('cta-banner', {
    template: '#tpl-cta-banner',
    props: { title: String, body: String, action: String }
  });

  app.component('site-footer', {
    template: '#tpl-site-footer',
    props: {
      brand: String,
      columns: { type: Array, default: () => [] }
    },
    computed: {
      year() {
        return new Date().getFullYear();
      }
    }
  });

  app.mount('#app');
</script>
</body>
</html>
